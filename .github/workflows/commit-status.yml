name: Commit Status Report

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build commit summary
        shell: bash
        run: |
          set -euo pipefail

          summary_file="$GITHUB_STEP_SUMMARY"

          sanitize_cell() {
            local value="$1"
            value="${value//$'\r'/ }"
            value="${value//$'\n'/ }"
            value="${value//|/\\|}"
            printf '%s' "$value"
          }

          github_latest_commit() {
            local branch="$1"
            curl -fsSL "https://api.github.com/repos/Anatdx/YukiSU/commits/${branch}" | jq -r '.sha'
          }

          github_latest_message() {
            local branch="$1"
            curl -fsSL "https://api.github.com/repos/Anatdx/YukiSU/commits/${branch}" | jq -r '.commit.message | split("\n")[0]'
          }

          {
            echo "# Commit Status Report"
            echo ""
            echo "This report shows the latest upstream commit for YukiSU."
            echo ""
          } >> "$summary_file"

          {
            echo "## YukiSU"
            echo ""
            echo "| Branch | Latest Commit | Latest Message |"
            echo "| --- | --- | --- |"
          } >> "$summary_file"

          YUKISU_BRANCHES=(
            "main"
            "feat/yukizygisk"
          )

          for branch in "${YUKISU_BRANCHES[@]}"; do
            latest_commit="$(github_latest_commit "$branch")"
            latest_message="$(github_latest_message "$branch")"
            latest_message="$(sanitize_cell "$latest_message")"
            printf '| %s | %s | %s |\n' "$branch" "$latest_commit" "$latest_message" >> "$summary_file"
          done