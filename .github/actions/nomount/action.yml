name: Setup Mirage
description: Clone and apply Mirage patches
inputs:
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true
  mirage_branch:
    description: 'Mirage branch or commit (empty = latest master)'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download and Apply Mirage
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        MIRAGE_INPUT="${{ inputs.mirage_branch }}"
        if [ -z "$MIRAGE_INPUT" ]; then
          MIRAGE_INPUT="master"
        fi
        echo "Using Mirage branch: $MIRAGE_INPUT"
        curl -LSs "https://raw.githubusercontent.com/maxsteeel/Mirage/master/setup.sh" | bash -s "$MIRAGE_INPUT"
        
        # Fix Makefile - setup.sh has broken printf that adds invalid syntax
        if [ -f "common/fs/Makefile" ]; then
          sed -i '/^obj-\$(CONFIG_MIRAGE) += mirage/d' common/fs/Makefile
          echo 'obj-$(CONFIG_MIRAGE) += mirage/' >> common/fs/Makefile
        elif [ -f "fs/Makefile" ]; then
          sed -i '/^obj-\$(CONFIG_MIRAGE) += mirage/d' fs/Makefile
          echo 'obj-$(CONFIG_MIRAGE) += mirage/' >> fs/Makefile
        fi

    - name: Enable Config
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        echo "CONFIG_MIRAGE=y" >> ${{ github.workspace }}/wild_gki.fragment